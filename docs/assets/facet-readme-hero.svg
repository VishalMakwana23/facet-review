<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc">
  <title id="title">Facet Review</title>
  <desc id="desc">A dark geometric banner showing a complex document becoming a clear decision workspace through Facet.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.52" stop-color="#111a30"/>
      <stop offset="1" stop-color="#15112b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9b8cff"/>
      <stop offset="1" stop-color="#6656e8"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26324c" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#182238" stop-opacity="0.94"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#050713" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1440" height="480" rx="28" fill="url(#bg)"/>
  <circle cx="1265" cy="85" r="150" fill="#7c6cff" opacity="0.13" filter="url(#glow)"/>
  <circle cx="95" cy="430" r="155" fill="#27d7b0" opacity="0.09" filter="url(#glow)"/>
  <path d="M0 365 C260 280 440 470 705 365 S1130 280 1440 365" fill="none" stroke="#8290b1" stroke-opacity="0.08" stroke-width="2"/>
  <path d="M0 395 C260 310 440 500 705 395 S1130 310 1440 395" fill="none" stroke="#8290b1" stroke-opacity="0.05" stroke-width="2"/>

  <g transform="translate(112 96)">
    <g transform="translate(0 4)">
      <path d="M42 0 84 24v48L42 96 0 72V24Z" fill="url(#accent)"/>
      <path d="M42 14 70 30v32L42 78 14 62V30Z" fill="#15112b" opacity="0.78"/>
      <path d="M42 14v64M14 30l56 32M70 30 14 62" fill="none" stroke="#c6beff" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    </g>
    <text x="112" y="60" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="-1.8">Facet Review</text>
    <text x="2" y="142" fill="#b8c3db" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="400">See every angle. Comment in context. Decide with confidence.</text>
    <g transform="translate(2 184)">
      <rect width="166" height="42" rx="21" fill="#1d2940" stroke="#425170"/>
      <circle cx="23" cy="21" r="6" fill="#27d7b0"/>
      <text x="40" y="27" fill="#dce6f8" font-family="JetBrains Mono, Consolas, monospace" font-size="15">LOCAL-FIRST</text>
      <rect x="178" width="188" height="42" rx="21" fill="#1d2940" stroke="#425170"/>
      <circle cx="201" cy="21" r="6" fill="#9b8cff"/>
      <text x="218" y="27" fill="#dce6f8" font-family="JetBrains Mono, Consolas, monospace" font-size="15">TOKEN-EFFICIENT</text>
      <rect x="378" width="164" height="42" rx="21" fill="#1d2940" stroke="#425170"/>
      <circle cx="401" cy="21" r="6" fill="#f5b95f"/>
      <text x="418" y="27" fill="#dce6f8" font-family="JetBrains Mono, Consolas, monospace" font-size="15">REVIEWABLE</text>
    </g>
  </g>

  <g transform="translate(930 72)" filter="url(#shadow)">
    <rect width="386" height="326" rx="22" fill="url(#glass)" stroke="#465675"/>
    <rect x="24" y="24" width="220" height="16" rx="8" fill="#eef2ff"/>
    <rect x="24" y="52" width="148" height="8" rx="4" fill="#8491ad"/>
    <g transform="translate(24 88)">
      <rect width="162" height="92" rx="13" fill="#222e48" stroke="#435374"/>
      <text x="16" y="27" fill="#aeb9d0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">RECOMMENDATION</text>
      <rect x="16" y="43" width="119" height="8" rx="4" fill="#9b8cff"/>
      <rect x="16" y="61" width="92" height="7" rx="3.5" fill="#687792"/>
      <rect x="16" y="76" width="126" height="7" rx="3.5" fill="#687792"/>
      <rect x="176" width="162" height="92" rx="13" fill="#222e48" stroke="#435374"/>
      <text x="192" y="27" fill="#aeb9d0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">DECISION</text>
      <circle cx="198" cy="53" r="8" fill="#27d7b0"/>
      <rect x="214" y="49" width="92" height="8" rx="4" fill="#dce6f8"/>
      <circle cx="198" cy="76" r="8" fill="none" stroke="#697894" stroke-width="2"/>
      <rect x="214" y="72" width="70" height="8" rx="4" fill="#697894"/>
    </g>
    <g transform="translate(24 198)">
      <rect width="338" height="48" rx="12" fill="#1b263d" stroke="#3c4b69"/>
      <circle cx="24" cy="24" r="10" fill="#f5b95f"/>
      <rect x="44" y="15" width="164" height="7" rx="3.5" fill="#d3dbea"/>
      <rect x="44" y="28" width="238" height="6" rx="3" fill="#65738d"/>
    </g>
    <g transform="translate(24 264)">
      <rect width="232" height="38" rx="19" fill="url(#accent)"/>
      <text x="29" y="24" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">SEND FEEDBACK TO AGENT</text>
      <circle cx="330" cy="19" r="8" fill="#27d7b0"/>
    </g>
  </g>
</svg>
